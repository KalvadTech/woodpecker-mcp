[project]
name = "woodpecker-mcp"
version = "0.1.0"
description = "Stateless MCP server for Woodpecker CI. Each request carries the user's own personal access token. No database, no shared secret."
requires-python = ">=3.14"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pierre Guillemot", email = "pierre@kalvad.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "woodpecker",
    "ci",
    "cd",
    "llm-tools",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]==1.28.1",
    "httpx==0.28.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
]

[project.urls]
Homepage = "https://github.com/KalvadTech/woodpecker-mcp"
Repository = "https://github.com/KalvadTech/woodpecker-mcp"
Issues = "https://github.com/KalvadTech/woodpecker-mcp/issues"

[project.scripts]
woodpecker-mcp = "woodpecker_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodpecker_mcp"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.15.21",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
