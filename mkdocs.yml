site_name: woodpecker-mcp
site_description: Stateless MCP server for Woodpecker CI. Each request carries the user's own personal access token.
site_url: https://kalvadtech.github.io/woodpecker-mcp/
repo_url: https://github.com/KalvadTech/woodpecker-mcp
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
nav:
  - Overview: index.md
  - Setup: setup.md
  - User Guide:
      - Usage Guide: usage/index.md
      - MCP Clients: usage/mcp-clients.md
      - Resources: usage/resources.md
      - Deployment: usage/deployment.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KalvadTech/woodpecker-mcp
copyright: Copyright &copy; 2026 Kalvad